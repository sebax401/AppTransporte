<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title></ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large" >Patente</ion-title>
      <ion-label *ngFor="let vehiculo of vehiculos">{{ vehiculo.patente }}</ion-label>
    </ion-toolbar>
  </ion-header>
</ion-content>
